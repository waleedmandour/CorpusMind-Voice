[package]
name = "corpusmind-voice"
version = "1.2.2"
description = "CorpusMind Voice — offline audio to linguistically annotated corpus"
authors = ["Dr. Waleed Mandour", "Prof. Wesam Ibrahim"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job Object binding so the Node sidecar can never outlive the app
# (prevents locked files during upgrades). Windows only.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
