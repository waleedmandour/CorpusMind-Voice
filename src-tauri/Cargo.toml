[package]
name = "corpusmind-voice"
version = "1.0.0"
description = "CorpusMind Voice — offline audio to linguistically annotated corpus"
authors = ["Dr. Waleed Mandour"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "corpusmind_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
