name: Build CorpusMind Voice

# Builds every target after the sandbox-rebuild:
#   - Web (Next.js standalone + PWA)
#   - Windows  x64  (Tauri NSIS + MSI)
#   - Linux    x64  (Tauri deb + AppImage)
#   - macOS    arm64 + x86_64 (Tauri app + dmg)
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  NODE_DIST: "v22.14.0"

jobs:
  web:
    name: Web build (Next.js + PWA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run db:push
        env:
          DATABASE_URL: "file:../db/build.db"
      - run: bun run build
        env:
          DATABASE_URL: "file:../db/build.db"
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: .next/standalone

  desktop:
    name: Desktop (${{ matrix.os }} · ${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: ""
          # NSIS only: WiX candle.exe crashes with no output on GH runners,
          # and the parent CorpusMind also ships the NSIS setup.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: ""
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Download Node.js sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-linux-x64.tar.xz" -o node.tar.xz
              tar -xJf node.tar.xz
              cp "node-${NODE_DIST}-linux-x64/bin/node" src-tauri/binaries/node-x86_64-unknown-linux-gnu
              ;;
            x86_64-pc-windows-msvc)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-win-x64.zip" -o node.zip
              unzip -o -q node.zip
              cp "node-${NODE_DIST}-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
              ;;
            aarch64-apple-darwin)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-darwin-arm64.tar.gz" -o node.tar.gz
              tar -xzf node.tar.gz
              cp "node-${NODE_DIST}-darwin-arm64/bin/node" src-tauri/binaries/node-aarch64-apple-darwin
              ;;
            x86_64-apple-darwin)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-darwin-x64.tar.gz" -o node.tar.gz
              tar -xzf node.tar.gz
              cp "node-${NODE_DIST}-darwin-x64/bin/node" src-tauri/binaries/node-x86_64-apple-darwin
              ;;
          esac
          chmod +x src-tauri/binaries/*

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database seed
        shell: bash
        run: |
          bun run db:push
          cp db/custom.db db/seed.db
        env:
          DATABASE_URL: "file:../db/custom.db"

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:../db/custom.db"
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  release:
    # Publishes the desktop installers when a v* tag is pushed.
    # Single-release policy: every other release (and its tag) is removed
    # first, so the repo keeps exactly one release — v1.0.0.
    name: Release (single v1.0.0, desktop installers)
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove all other releases and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          echo "Deleting releases other than $tag …"
          gh api "repos/$repo/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name != \"$tag\") | .id" \
          | while read -r rid; do
              [ -z "$rid" ] && continue
              echo "  deleting release id=$rid"
              gh api -X DELETE "repos/$repo/releases/$rid" || true
            done

          echo "Deleting leftover v* tags other than $tag …"
          gh api "repos/$repo/tags?per_page=100" --paginate --jq '.[].name' \
          | while read -r t; do
              [ -z "$t" ] && continue
              case "$t" in
                v*)
                  if [ "$t" != "$tag" ]; then
                    echo "  deleting tag $t"
                    gh api -X DELETE "repos/$repo/git/refs/tags/$t" || true
                  fi
                  ;;
              esac
            done

          echo "Releases now on repo:"
          gh api "repos/$repo/releases?per_page=100" --jq '.[] | .tag_name' || true

      - name: Download all desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: corpusmind-voice-*
          merge-multiple: true
          path: bundles

      - name: Collect installer files
        run: |
          mkdir -p dist
          find bundles -type f \( \
              -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
              -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} dist/ \;
          echo "Installers to publish:"
          ls -la dist
          [ -z "$(ls -A dist)" ] && { echo "ERROR: no installer files found"; exit 1; } || true

      - name: Create the release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          # replace an existing release for this tag (idempotent re-runs)
          rid=$(gh api "repos/$repo/releases/tags/$tag" --jq .id 2>/dev/null || true)
          if [ -n "$rid" ]; then
            echo "Deleting stale release id=$rid for $tag"
            gh api -X DELETE "repos/$repo/releases/$rid"
          fi

          gh release create "$tag" dist/* \
            --repo "$repo" \
            --title "CorpusMind Voice v1.0.0" \
            --notes-file RELEASE.md

