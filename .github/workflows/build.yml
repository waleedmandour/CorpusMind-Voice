name: Build CorpusMind Voice

# Builds every target:
#   - Web (Next.js standalone + PWA)
#   - Windows  x64  (Tauri NSIS setup.exe + MSI)      [MSI in a best-effort job:
#     WiX candle.exe has crashed with no output on some runners; NSIS must
#     never be blocked by it]
#   - Linux    x64  (Tauri deb + AppImage)
#   - macOS    arm64 (Apple Silicon) + x86_64 (Intel, cross-compiled on the
#     arm64 runner — macos-13 Intel runners are permanently saturated)
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  NODE_DIST: "v22.14.0"

jobs:
  web:
    name: Web build (Next.js + PWA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run db:push
        env:
          DATABASE_URL: "file:../db/build.db"
      - run: bun run build
        env:
          DATABASE_URL: "file:../db/build.db"
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: .next/standalone

  desktop:
    name: Desktop (${{ matrix.os }} · ${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb"
          # NSIS: the primary Windows installer (same as the parent CorpusMind)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: ""
          # Intel macOS cross-compiled on the arm64 runner (works reliably;
          # macos-13 runners queue 2h+)
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk + AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          # linuxdeploy-x86_64.AppImage needs FUSE to execute
          sudo apt-get install -y libfuse2

      - name: Download Node.js sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-linux-x64.tar.xz" -o node.tar.xz
              tar -xJf node.tar.xz
              cp "node-${NODE_DIST}-linux-x64/bin/node" src-tauri/binaries/node-x86_64-unknown-linux-gnu
              ;;
            x86_64-pc-windows-msvc)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-win-x64.zip" -o node.zip
              unzip -o -q node.zip
              cp "node-${NODE_DIST}-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
              ;;
            aarch64-apple-darwin)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-darwin-arm64.tar.gz" -o node.tar.gz
              tar -xzf node.tar.gz
              cp "node-${NODE_DIST}-darwin-arm64/bin/node" src-tauri/binaries/node-aarch64-apple-darwin
              ;;
            x86_64-apple-darwin)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-darwin-x64.tar.gz" -o node.tar.gz
              tar -xzf node.tar.gz
              cp "node-${NODE_DIST}-darwin-x64/bin/node" src-tauri/binaries/node-x86_64-apple-darwin
              ;;
          esac
          chmod +x src-tauri/binaries/*

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database seed
        shell: bash
        run: |
          bun run db:push
          cp db/custom.db db/seed.db
        env:
          DATABASE_URL: "file:../db/custom.db"

      - name: Pre-verify linuxdeploy into Tauri cache
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y appstream
          mkdir -p ~/.cache/tauri
          curl -sL -o ~/.cache/tauri/ld-real.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          file ~/.cache/tauri/ld-real.AppImage | grep -q ELF \
            || { echo "linuxdeploy download is not an ELF binary"; exit 1; }
          chmod +x ~/.cache/tauri/ld-real.AppImage
          cat > ~/.cache/tauri/linuxdeploy-x86_64.AppImage <<'WRAPPER'
          #!/usr/bin/env bash
          # GH runners have no /dev/fuse; a direct AppImage execve returns
          # ENOEXEC ("failed to run linuxdeploy"). Force extract-and-run
          # regardless of the env the bundler spawns us with.
          exec env APPIMAGE_EXTRACT_AND_RUN=1 "$(dirname "$0")/ld-real.AppImage" "$@"
          WRAPPER
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          ~/.cache/tauri/linuxdeploy-x86_64.AppImage --version

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:../db/custom.db"
          # bundler's own strip step breaks linuxdeploy AppImage assembly
          NO_STRIP: ${{ matrix.os == 'ubuntu-22.04' && 'true' || 'false' }}
          # never rely on FUSE being available
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.os == 'ubuntu-22.04' && '1' || '' }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  # Best-effort MSI: WiX candle.exe crashed with no output on some GH runners
  # in earlier releases. Keep it isolated so NSIS always ships.
  desktop-msi:
    name: Desktop (windows-latest · x86_64 MSI, best effort)
    needs: web
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download Node.js sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-win-x64.zip" -o node.zip
          unzip -o -q node.zip
          cp "node-${NODE_DIST}-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Prepare database seed
        shell: bash
        run: |
          bun run db:push
          cp db/custom.db db/seed.db
        env:
          DATABASE_URL: "file:../db/custom.db"
      - name: Build MSI bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:../db/custom.db"
        with:
          args: --target x86_64-pc-windows-msvc --bundles msi
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: ignore

  release:
    # Publishes the desktop installers when a v* tag is pushed.
    # Single-release policy: every other release (and its tag) is removed
    # first, so the repo keeps exactly one release — v1.1.0.
    name: Release (single v1.1.0, desktop installers + icon)
    needs: [desktop, desktop-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove all other releases and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          echo "Deleting releases other than $tag …"
          gh api "repos/$repo/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name != \"$tag\") | .id" \
          | while read -r rid; do
              [ -z "$rid" ] && continue
              echo "  deleting release id=$rid"
              gh api -X DELETE "repos/$repo/releases/$rid" || true
            done

          echo "Deleting leftover v* tags other than $tag …"
          gh api "repos/$repo/tags?per_page=100" --paginate --jq '.[].name' \
          | while read -r t; do
              [ -z "$t" ] && continue
              case "$t" in
                v*)
                  if [ "$t" != "$tag" ]; then
                    echo "  deleting tag $t"
                    gh api -X DELETE "repos/$repo/git/refs/tags/$t" || true
                  fi
                  ;;
              esac
            done

          echo "Releases now on repo:"
          gh api "repos/$repo/releases?per_page=100" --jq '.[] | .tag_name' || true

      - name: Download all desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: corpusmind-voice-*
          merge-multiple: true
          path: bundles

      - name: Collect installer files
        run: |
          mkdir -p dist
          find bundles -type f \( \
              -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
              -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} dist/ \;
          # embed the app icon (clean master, no border) in the release
          cp design/CorpusMindVoiceIcon.png dist/CorpusMindVoiceIcon.png
          echo "Assets to publish:"
          ls -la dist
          [ -z "$(ls -A dist)" ] && { echo "ERROR: no asset files found"; exit 1; } || true

      - name: Create the release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          # replace an existing release for this tag (idempotent re-runs)
          rid=$(gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>/dev/null | head -n1 || true)
          case "$rid" in
            ''|*[!0-9]*) rid="" ;;   # 404 body / empty -> no existing release
          esac
          if [ -n "$rid" ]; then
            echo "Deleting stale release id=$rid for $tag"
            gh api -X DELETE "repos/$repo/releases/$rid"
          fi

          gh release create "$tag" dist/* \
            --repo "$repo" \
            --title "CorpusMind Voice $tag" \
            --notes-file RELEASE.md
