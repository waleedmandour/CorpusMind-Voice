name: Build CorpusMind Voice

# Builds every target:
#   - Web (Next.js standalone + PWA)
#   - Windows  x64  (Tauri NSIS setup.exe + MSI)      [MSI in a best-effort job:
#     pinned to windows-2022 because the windows-2025 image dropped .NET
#     Framework 3.5, which WiX 3 candle.exe needs to even start; NSIS must
#     never be blocked by it]
#   - Linux    x64  (Tauri deb; AppImage stays a local build - GH runners
#     have no /dev/fuse, so linuxdeploy cannot run there)
#   - macOS    arm64 (Apple Silicon). The Intel dmg was dropped in v1.3.0:
#     upstream ONNX Runtime (onnxruntime-node 1.24.x, pinned by
#     transformers.js) ships NO darwin-x64 binary, so the speech stack cannot
#     load on Intel macs at all - the release smoke gate caught this. Intel
#     mac users are served by the web/PWA build. (macos-13 Intel runners
#     were also permanently saturated.)
#
# Runner lifecycle watchlist (these breaks arrive silently when GitHub rotates
# images - see worklog Task 10):
#   - windows-2022 (MSI job) is still a supported label (verified 2026-09,
#     actions/runner-images), but the windows-2025 image already forced this
#     pin once. When windows-2022 is deprecated, migrate the MSI to WiX 4/5
#     (no .NET Framework 3.5 dependency) or ship NSIS-only.
#   - Monitored: .github/workflows/runner-watch.yml runs weekly on
#     windows-2022 and turns red when the label or the .NET Framework 3.5
#     payload (WiX 3's hard requirement) disappears from the image.
#   - WiX 4/5 evaluation (2026-09): tauri's MSI bundler ships its own WiX
#     3.14 toolset and has no supported switch to a newer WiX major, so a
#     migration would mean maintaining a custom packaging path. Decision:
#     keep WiX 3 on this pin, rely on the DISM NetFx3 step below, and ship
#     NSIS-only if the pin is ever retired.
#   - macos-14 is ALREADY flagged deprecated by actions/runner-images
#     (issue #13518); move the macOS matrix to macos-15 before it is retired.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# One build per SHA: pushing main and the v-tag together fires two events for
# the same commit; the tag run supersedes (cancels) the branch run instead of
# doubling runner usage and racing the release job.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NODE_DIST: "v22.14.0"

jobs:
  web:
    name: Web build (Next.js + PWA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      # Fail the build early when version strings drift across the nine
      # version-bearing files (package.json is the source of truth).
      - run: node scripts/sync-version.mjs --check
      - run: bun run db:push
        env:
          DATABASE_URL: "file:../db/build.db"
      - run: bun run build
        env:
          DATABASE_URL: "file:../db/build.db"
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: .next/standalone

  desktop:
    name: Desktop (${{ matrix.os }} · ${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb"
          # NSIS: the primary Windows installer (same as the parent CorpusMind)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: ""
          # Intel macOS target REMOVED (v1.3.0 rebuild): onnxruntime-node
          # 1.24.x ships no darwin-x64 binary, so the ASR stack cannot load
          # there; see the header comment and RELEASE.md
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps (webkit2gtk)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # The preinstalled Google Chrome apt repo intermittently serves
          # mismatched indexes and aborts apt-get update (exit 100) even
          # though nothing here needs Chrome. Drop it before refreshing.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Download Node.js sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-linux-x64.tar.xz" -o node.tar.xz
              tar -xJf node.tar.xz
              cp "node-${NODE_DIST}-linux-x64/bin/node" src-tauri/binaries/node-x86_64-unknown-linux-gnu
              ;;
            x86_64-pc-windows-msvc)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-win-x64.zip" -o node.zip
              unzip -o -q node.zip
              cp "node-${NODE_DIST}-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
              ;;
            aarch64-apple-darwin)
              curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-darwin-arm64.tar.gz" -o node.tar.gz
              tar -xzf node.tar.gz
              cp "node-${NODE_DIST}-darwin-arm64/bin/node" src-tauri/binaries/node-aarch64-apple-darwin
              ;;
          esac
          chmod +x src-tauri/binaries/*

      # Rust hygiene gates: formatting and lints must stay clean, same bar as
      # tsc/eslint for the TypeScript side.
      #
      # Ordering matters: clippy executes the tauri-build build script, which
      # validates EVERY resource path in tauri.conf.json (../db/seed.db AND
      # ../.next/standalone). seed.db is provisioned by "Prepare database
      # seed" below; .next/standalone is produced by beforeBuildCommand
      # (bun run build) inside "Build Tauri bundle". So fmt/clippy can only
      # run AFTER the bundle step, otherwise the build script aborts with
      # "resource path ... doesn't exist". Placing the gate before the
      # artifact upload keeps the release job gated on lint failures.
      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database seed
        shell: bash
        run: |
          bun run db:push
          cp db/custom.db db/seed.db
        env:
          DATABASE_URL: "file:../db/custom.db"

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:../db/custom.db"
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      - name: Rust hygiene (fmt + clippy)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Optional Authenticode signing: signs only when the repo secrets
      # WINDOW_PFX_BASE64 + WINDOW_PFX_PASSWORD exist (see scripts/sign-windows.ps1).
      # Without them this is a no-op, so fork/OSS builds stay unsigned.
      - name: Sign installers (optional)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CMV_SIGN_PFX_BASE64: ${{ secrets.WINDOW_PFX_BASE64 }}
          CMV_SIGN_PFX_PASSWORD: ${{ secrets.WINDOW_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  # Best-effort MSI: keep it isolated so NSIS always ships.
  # windows-2022 is required: the windows-2025 runner image (windows-latest
  # since 2025) no longer ships .NET Framework 3.5, so WiX 3.14 candle.exe
  # fails to start ("failed to run ...\\WixTools314\\candle.exe", no output).
  # Monitored weekly by runner-watch.yml; a missing MSI raises a loud
  # warning annotation + run-summary note in the release job.
  desktop-msi:
    name: Desktop (windows-2022 · x86_64 MSI, best effort)
    needs: web
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ensure .NET Framework 3.5 (WiX 3 candle.exe needs it to start)
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Windows\Microsoft.NET\Framework64\v3.5')) {
            Write-Host 'NetFx3 missing - enabling via DISM (payload from Windows Update)'
            DISM /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
          } else {
            Write-Host 'NetFx3 runtime already present'
          }
      - name: Download Node.js sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -sL "https://nodejs.org/dist/${NODE_DIST}/node-${NODE_DIST}-win-x64.zip" -o node.zip
          unzip -o -q node.zip
          cp "node-${NODE_DIST}-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Prepare database seed
        shell: bash
        run: |
          bun run db:push
          cp db/custom.db db/seed.db
        env:
          DATABASE_URL: "file:../db/custom.db"
      - name: Build MSI bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:../db/custom.db"
        with:
          # --verbose: candle.exe/stderr is swallowed otherwise (tauri#12148);
          # needed to see the real WiX error when bundling fails
          args: --verbose --target x86_64-pc-windows-msvc --bundles msi
      - name: Sign MSI (optional)
        shell: pwsh
        env:
          CMV_SIGN_PFX_BASE64: ${{ secrets.WINDOW_PFX_BASE64 }}
          CMV_SIGN_PFX_PASSWORD: ${{ secrets.WINDOW_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: ignore
      - name: Upload generated WiX source (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpusmind-voice-msi-wxs-debug
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/wix/**/*.wxs
          if-no-files-found: ignore

  release:
    # Publishes the desktop installers when a v* tag is pushed.
    # Single-release policy: every other release (and its tag) is removed
    # first, so the repo keeps exactly one release: the current v* tag.
    name: Release (single v* tag, desktop installers + icon)
    needs: [desktop, desktop-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Order invariant: collect and ASSERT the artifacts first, delete old
      # releases second. Failing on missing required installers before the
      # deletion step keeps the previous release intact instead of leaving
      # the repo with no release at all.
      - name: Download all desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: corpusmind-voice-*
          merge-multiple: true
          path: bundles

      - name: Collect installer files
        run: |
          mkdir -p dist
          find bundles -type f \( \
              -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
              -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} dist/ \;
          # embed the app icon (clean master, no border) in the release
          cp design/CorpusMindVoiceIcon.png dist/CorpusMindVoiceIcon.png
          # ship the 2-page user guide (PDF) with the release
          cp docs/user-guide-en.pdf dist/CorpusMind-Voice-User-Guide-EN.pdf
          echo "Assets to publish:"
          ls -la dist
          [ -z "$(ls -A dist)" ] && { echo "ERROR: no asset files found"; exit 1; } || true

      # Asset guard: required installers must exist (fail fast, before any
      # deletion). The MSI stays best-effort: missing it only raises a loud
      # warning + run-summary note, the release still publishes NSIS.
      - name: Assert required installers (warn on missing MSI)
        run: |
          set -euo pipefail
          cd dist
          pass=1
          for pattern in "*-setup.exe" "*.deb" "*aarch64.dmg"; do
            n=$(find . -maxdepth 1 -type f -name "$pattern" | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "ERROR: required installer missing: $pattern"
              pass=0
            else
              echo "ok: $pattern ($n file(s))"
            fi
          done
          if [ "$pass" -ne 1 ]; then
            echo "::error::Required installers missing from dist/ - the existing release was NOT modified."
            exit 1
          fi
          msi=$(find . -maxdepth 1 -type f -name "*.msi" | wc -l)
          if [ "$msi" -eq 0 ]; then
            echo "::warning::MSI missing from the release assets. The MSI job is best-effort (windows-2022 pin; WiX 3 candle.exe needs .NET Framework 3.5). NSIS still ships; inspect the desktop-msi job logs and .github/workflows/runner-watch.yml."
            {
              echo "## Release asset guard"
              echo ""
              echo "- Required installers (NSIS setup, deb, both DMGs): present"
              echo "- MSI: **missing** (best-effort job; see the desktop-msi job logs and the runner watchlist in build.yml)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok: *.msi ($msi file(s))"
          fi

      - name: Remove all other releases and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          echo "Deleting releases other than $tag …"
          gh api "repos/$repo/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name != \"$tag\") | .id" \
          | while read -r rid; do
              [ -z "$rid" ] && continue
              echo "  deleting release id=$rid"
              gh api -X DELETE "repos/$repo/releases/$rid" || true
            done

          echo "Deleting leftover v* tags other than $tag …"
          gh api "repos/$repo/tags?per_page=100" --paginate --jq '.[].name' \
          | while read -r t; do
              [ -z "$t" ] && continue
              case "$t" in
                v*)
                  if [ "$t" != "$tag" ]; then
                    echo "  deleting tag $t"
                    gh api -X DELETE "repos/$repo/git/refs/tags/$t" || true
                  fi
                  ;;
              esac
            done

          echo "Releases now on repo:"
          gh api "repos/$repo/releases?per_page=100" --jq '.[] | .tag_name' || true

      - name: Create the release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"

          # replace an existing release for this tag (idempotent re-runs)
          rid=$(gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>/dev/null | head -n1 || true)
          case "$rid" in
            ''|*[!0-9]*) rid="" ;;   # 404 body / empty -> no existing release
          esac
          if [ -n "$rid" ]; then
            echo "Deleting stale release id=$rid for $tag"
            gh api -X DELETE "repos/$repo/releases/$rid"
          fi

          gh release create "$tag" dist/* \
            --repo "$repo" \
            --title "CorpusMind Voice $tag" \
            --notes-file RELEASE.md
