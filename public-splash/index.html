    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: linear-gradient(135deg, #0A1C3C 0%, #101f3c 45%, #1A1030 100%);
        color: #e6eefc; font-family: "Segoe UI", Tahoma, sans-serif; text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 0 32px rgba(34,211,238,.35); }

      p { font-size: 13px; color: #93a8c8; }
      .wave { display: flex; gap: 3px; align-items: center; height: 22px; }
      .bar { width: 3px; height: 100%; border-radius: 2px; background: #22d3ee; animation: w 1.1s ease-in-out infinite; }
      .bar:nth-child(2) { animation-delay: .12s; } .bar:nth-child(3) { animation-delay: .24s; }
      .bar:nth-child(4) { animation-delay: .36s; } .bar:nth-child(5) { animation-delay: .48s; }
      @keyframes w { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    </style>
